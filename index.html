<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilot Nav">
<link rel="manifest" href="manifest.json">
<title>Pilot Navigation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;
  background:#04080f;
  font-family:'Courier New',monospace;
  color:#c8dff0;
  display:flex;flex-direction:column;align-items:center;
  padding:max(env(safe-area-inset-top),10px) 10px max(env(safe-area-inset-bottom),14px);
  gap:9px;
}

/* HEADER */
.hdr{text-align:center;}
.hdr-sub{font-size:11px;letter-spacing:4px;color:#3af;text-transform:uppercase;margin-bottom:2px;}
.hdr-title{font-size:20px;font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 0 16px #3af9;}

/* CARDS ROW */
.top-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:460px;}
.card{
  background:linear-gradient(135deg,#081524,#0b1e30);
  border:1px solid #1a3a5c;border-radius:12px;
  padding:12px 10px;text-align:center;
  box-shadow:0 3px 14px #0005,inset 0 1px 0 #ffffff06;
}
.card-lbl{font-size:13px;letter-spacing:3px;color:#4af;margin-bottom:4px;font-weight:700;}
.card-val{font-size:42px;font-weight:900;line-height:1;color:#1e3a52;transition:color .3s;}
.card-val.on-spd{color:#3effa0;text-shadow:0 0 14px #3effa055;}
.card-val.on-dir{color:#ffe066;text-shadow:0 0 14px #ffe06644;}
.card-unit{font-size:12px;color:#6a9ab0;margin-top:4px;letter-spacing:2px;}
.card-sub{font-size:14px;color:#ffe066;margin-top:3px;letter-spacing:2px;font-weight:700;}

/* POSITION */
.pos-card{
  background:linear-gradient(135deg,#081524,#0b1e30);
  border:1px solid #1a3a5c;border-radius:12px;
  padding:10px 14px;width:100%;max-width:460px;
  display:flex;justify-content:space-around;
  box-shadow:0 3px 14px #0005;
}
.pos-item{text-align:center;}
.pos-lbl{font-size:12px;letter-spacing:3px;color:#4af;margin-bottom:3px;font-weight:700;}
.pos-val{font-size:15px;font-weight:700;color:#c8dff0;letter-spacing:1px;}

/* HEADING INPUT */
.hdg-card{
  background:linear-gradient(135deg,#081524,#0b1e30);
  border:1px solid #1a3a5c;border-radius:12px;
  padding:10px 14px;width:100%;max-width:460px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 3px 14px #0005;
}
.hdg-lbl{font-size:13px;letter-spacing:3px;color:#4af;font-weight:700;flex:1;}
.hdg-input{
  background:#050e1c;border:1px solid #2a5a8a;border-radius:8px;
  color:#ffe066;font-size:20px;font-weight:900;
  font-family:'Courier New',monospace;
  width:80px;padding:7px 8px;text-align:center;outline:none;
}
.hdg-unit{font-size:13px;color:#6a9ab0;margin-left:-4px;}
.btn-sm{
  border-radius:8px;font-family:'Courier New',monospace;
  cursor:pointer;font-size:12px;letter-spacing:2px;
  padding:8px 13px;border:none;font-weight:700;
}
.btn-set{background:#1a4a7a;border:1px solid #2a6aaa;color:#e0f0ff;}
.btn-clr{background:transparent;border:1px solid #2a3a5a;color:#5a8aaa;display:none;}

/* SHIP DIAGRAM */
.ship-section{
  width:100%;max-width:460px;
  background:linear-gradient(135deg,#050c18,#081524);
  border:1px solid #1a3a5c;border-radius:14px;
  padding:10px;
  box-shadow:0 4px 18px #0007,inset 0 1px 0 #ffffff04;
}
.ship-section-title{
  font-size:12px;letter-spacing:3px;color:#4af;
  text-align:center;margin-bottom:8px;font-weight:700;
}
.ship-svg-wrap{display:flex;justify-content:center;align-items:center;}

/* ACCURACY ROW */
.acc-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:460px;}
.acc-box{
  background:#081524;border:1px solid #1a3a5c;
  border-radius:10px;padding:9px 10px;text-align:center;
}
.acc-box.warn{border-color:#cc3333;}
.acc-lbl{font-size:12px;letter-spacing:2px;color:#4af;margin-bottom:3px;font-weight:700;}
.acc-box.warn .acc-lbl{color:#f66;}
.acc-val{font-size:15px;font-weight:700;color:#c8dff0;}
.acc-box.warn .acc-val{color:#f88;}

.banner{
  border-radius:9px;padding:8px 13px;font-size:12px;
  letter-spacing:1px;width:100%;max-width:460px;
  text-align:center;display:none;
}
.warn-banner{background:#1a0808;border:1px solid #aa3333;color:#ff8888;}

/* CONTROLS */
.controls{display:flex;gap:9px;width:100%;max-width:460px;}
.btn-main{
  flex:1;border-radius:12px;border:none;
  font-size:13px;font-weight:700;letter-spacing:3px;
  padding:14px;cursor:pointer;font-family:'Courier New',monospace;
}
.btn-start{background:linear-gradient(135deg,#0d4a2a,#0a6438);color:#3effa0;box-shadow:0 0 12px #2af07a1a;}
.btn-stop{background:linear-gradient(135deg,#4a0d0d,#6a1010);color:#ff8866;}
.btn-reset{
  background:#081524;border:1px solid #1e3a5a;
  border-radius:12px;color:#5a9ab0;
  font-size:11px;letter-spacing:2px;
  padding:14px 14px;cursor:pointer;font-family:'Courier New',monospace;
}
.status-row{
  display:flex;align-items:center;gap:7px;
  font-size:11px;letter-spacing:3px;color:#3a5a72;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:#1e3a52;flex-shrink:0;}
.status-dot.on{background:#3effa0;box-shadow:0 0 6px #3effa0;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-sub">Pilot Navigation System</div>
  <div class="hdr-title">BERTHING MONITOR</div>
</div>

<!-- Speed + Direction -->
<div class="top-cards">
  <div class="card">
    <div class="card-lbl">SPEED</div>
    <div class="card-val" id="spdVal">0.0</div>
    <div class="card-unit">KNOTS</div>
  </div>
  <div class="card">
    <div class="card-lbl">DIRECTION</div>
    <div class="card-val" id="dirVal">---</div>
    <div class="card-unit">DEGREES</div>
    <div class="card-sub" id="dirCard">--</div>
  </div>
</div>

<!-- Position -->
<div class="pos-card">
  <div class="pos-item">
    <div class="pos-lbl">LATITUDE</div>
    <div class="pos-val" id="latVal">--° --.- '</div>
  </div>
  <div class="pos-item">
    <div class="pos-lbl">LONGITUDE</div>
    <div class="pos-val" id="lonVal">--° --.- '</div>
  </div>
</div>

<!-- Vessel Heading Input -->
<div class="hdg-card">
  <div class="hdg-lbl">VESSEL HEADING</div>
  <input type="number" class="hdg-input" id="hdgInput" min="0" max="360" placeholder="000">
  <span class="hdg-unit">°</span>
  <button class="btn-sm btn-set" onclick="applyHeading()">SET</button>
  <button class="btn-sm btn-clr" id="clrBtn" onclick="clearHeading()">CLR</button>
</div>

<!-- Ship Diagram -->
<div class="ship-section">
  <div class="ship-section-title">VESSEL PLAN VIEW · MOTION VECTOR</div>
  <div class="ship-svg-wrap">
    <!-- 
      Radar-style view: vessel drawn small, rotated by heading.
      Canvas size 300x300. Vessel center at (150,150).
      Ship length ~60px (=120m scale), beam ~10px (=20m scale).
      Pilot at 90m from bow = 45px from bow tip.
      Bow points UP (North) when heading=0, rotates clockwise.
    -->
    <svg id="shipSvg" viewBox="0 0 300 300" width="100%" style="max-width:300px;display:block;">
      <!-- Background -->
      <rect width="300" height="300" fill="#04080f" rx="10"/>

      <!-- Compass rose rings -->
      <circle cx="150" cy="150" r="130" fill="none" stroke="#0d2035" stroke-width="1"/>
      <circle cx="150" cy="150" r="100" fill="none" stroke="#0a1825" stroke-width="0.5"/>
      <circle cx="150" cy="150" r="65"  fill="none" stroke="#0a1825" stroke-width="0.5"/>

      <!-- Compass tick marks -->
      <g id="compassTicks"></g>

      <!-- Cardinal letters (fixed, not rotating) -->
      <text x="150" y="16"  text-anchor="middle" dominant-baseline="central" fill="#3af" font-size="13" font-family="Courier New" font-weight="900">N</text>
      <text x="150" y="287" text-anchor="middle" dominant-baseline="central" fill="#7ab" font-size="11" font-family="Courier New" font-weight="700">S</text>
      <text x="287" y="150" text-anchor="middle" dominant-baseline="central" fill="#7ab" font-size="11" font-family="Courier New" font-weight="700">E</text>
      <text x="13"  y="150" text-anchor="middle" dominant-baseline="central" fill="#7ab" font-size="11" font-family="Courier New" font-weight="700">W</text>
      <text x="258" y="42"  text-anchor="middle" dominant-baseline="central" fill="#4a6a8a" font-size="9" font-family="Courier New">NE</text>
      <text x="258" y="258" text-anchor="middle" dominant-baseline="central" fill="#4a6a8a" font-size="9" font-family="Courier New">SE</text>
      <text x="42"  y="258" text-anchor="middle" dominant-baseline="central" fill="#4a6a8a" font-size="9" font-family="Courier New">SW</text>
      <text x="42"  y="42"  text-anchor="middle" dominant-baseline="central" fill="#4a6a8a" font-size="9" font-family="Courier New">NW</text>

      <!-- Heading line (thin dashed from center to ring) -->
      <line id="hdgLine" x1="150" y1="150" x2="150" y2="22"
            stroke="#ffe06644" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- VESSEL GROUP — rotated by heading around center (150,150) -->
      <!-- Ship: length 60px, beam 10px. Bow UP. Bow tip at (150,120), stern at (150,180) -->
      <!-- Pilot at 90m from bow: 90/120 * 60 = 45px from bow => y=120+45=165 -->
      <g id="vesselGroup" transform="rotate(0,150,150)">

        <!-- Hull -->
        <path id="hullPath"
          d="M150,120 L157,132 L157,176 L143,176 L143,132 Z"
          fill="#0d2540" stroke="#2a6aaa" stroke-width="1.5"/>
        <!-- Bow point -->
        <polygon id="bowPoly"
          points="150,118 157,132 143,132"
          fill="#0a1e33" stroke="#2a6aaa" stroke-width="1.5"/>

        <!-- Superstructure (stern area) -->
        <rect id="superRect" x="144" y="155" width="12" height="14" rx="1"
              fill="#0f2d48" stroke="#2a6aaa" stroke-width="1"/>

        <!-- Center line -->
        <line x1="150" y1="120" x2="150" y2="178" stroke="#1a3a5a" stroke-width="0.5" stroke-dasharray="3,3"/>

        <!-- Scale dots: 30m=15px, 60m=30px, 90m=45px from bow (y=120) -->
        <circle cx="150" cy="135" r="1.5" fill="#3a6a9a"/>
        <circle cx="150" cy="150" r="1.5" fill="#3a6a9a"/>
        <!-- 90m mark line -->
        <line x1="145" y1="165" x2="155" y2="165" stroke="#3a6a9a" stroke-width="0.8"/>

        <!-- BOW label -->
        <text x="150" y="113" text-anchor="middle" fill="#4af" font-size="7" font-family="Courier New" font-weight="bold">BOW</text>

        <!-- Motion vector (from pilot position 150,165) -->
        <line id="vLine" x1="150" y1="165" x2="150" y2="165"
              stroke="#3effa0" stroke-width="2.5" stroke-linecap="round"/>
        <polygon id="vHead" points="150,165 150,165 150,165" fill="#3effa0"/>

        <!-- Pilot dot -->
        <circle cx="150" cy="165" r="4.5" fill="#ffdd00" stroke="#fff" stroke-width="1"/>
        <circle cx="150" cy="165" r="1.8" fill="#fff"/>
        <text x="150" y="183" text-anchor="middle" fill="#ffdd00" font-size="6.5" font-family="Courier New" font-weight="bold">PILOT</text>
      </g>

      <!-- Heading readout top-left -->
      <text id="hdgReadout" x="10" y="294" fill="#ffe066" font-size="9" font-family="Courier New" font-weight="bold">HDG: ---°</text>

      <!-- Speed/Dir overlay bottom center -->
      <text id="svgLabel" x="150" y="294" text-anchor="middle"
            fill="#3effa0" font-size="9" font-family="Courier New" font-weight="bold">SPD: 0.0 kn  DIR: ---°</text>
    </svg>
  </div>
</div>

<!-- Accuracy -->
<div class="acc-row">
  <div class="acc-box" id="accBox">
    <div class="acc-lbl">GPS ACCURACY</div>
    <div class="acc-val" id="accVal">--</div>
  </div>
  <div class="acc-box">
    <div class="acc-lbl">DISTANCE</div>
    <div class="acc-val" id="distVal">0 m</div>
  </div>
</div>

<div class="banner warn-banner" id="warnBanner"></div>

<div class="controls">
  <button class="btn-main btn-start" id="mainBtn" onclick="startTracking()">▶ START GPS</button>
  <button class="btn-reset" onclick="resetData()">RESET</button>
</div>

<div class="status-row">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusTxt">STANDBY</span>
</div>

<script>
const ACC_LIMIT = 30;
let watchId=null, totalDist=0, lastPos=null;
let vesselHeading = null; // manual vessel heading (degrees)
let currentSpd = 0, currentDir = null;

const CARDS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function toCard(d){return CARDS[Math.round(d/22.5)%16];}
function msToKnots(ms){return ms*3600/1852;}
function haversine(a,b,c,d){
  const R=6371000,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function toDegMin(dec,isLat){
  const abs=Math.abs(dec);
  const deg=Math.floor(abs);
  const min=(abs-deg)*60;
  const h=isLat?(dec>=0?'N':'S'):(dec>=0?'E':'W');
  return `${deg}° ${min.toFixed(1)}' ${h}`;
}

// Draw compass ticks
(function(){
  const g=document.getElementById('compassTicks');
  const cx=150,cy=150;
  for(let i=0;i<72;i++){
    const a=i*5;
    const isMaj=a%90===0,isMed=a%30===0,is10=a%10===0;
    const r1=130,r2=isMaj?114:isMed?118:is10?122:126;
    const rad=(a-90)*Math.PI/180;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',cx+r1*Math.cos(rad)); l.setAttribute('y1',cy+r1*Math.sin(rad));
    l.setAttribute('x2',cx+r2*Math.cos(rad)); l.setAttribute('y2',cy+r2*Math.sin(rad));
    l.setAttribute('stroke',isMaj?'#4af':isMed?'#2a5a8a':is10?'#1a3a5a':'#111e2a');
    l.setAttribute('stroke-width',isMaj?'2':isMed?'1.2':'0.8');
    g.appendChild(l);
  }
})();

function rotateVessel(heading){
  document.getElementById('vesselGroup').setAttribute('transform',`rotate(${heading},150,150)`);
  // Update heading line
  const rad=(heading-90)*Math.PI/180;
  const ex=150+128*Math.cos(rad), ey=150+128*Math.sin(rad);
  const hl=document.getElementById('hdgLine');
  hl.setAttribute('x2',ex); hl.setAttribute('y2',ey);
  document.getElementById('hdgReadout').textContent=`HDG: ${String(Math.round(heading)).padStart(3,'0')}°`;
}

function updateVector(speedKn, dirDeg){
  // Vector direction relative to vessel:
  // dirDeg is absolute compass direction of motion
  // vesselHeading is absolute compass direction of bow
  // relative = dirDeg - vesselHeading (then add back in SVG space)
  // In SVG, vessel bow points UP (-y). 
  // Motion vector in SVG: absolute dir deg, since vessel group is already rotated
  // We draw the vector INSIDE the vesselGroup (which is rotated by heading),
  // so we need vector direction relative to vessel group = dirDeg - vesselHeading
  
  const MAX_SPD=3.0, MAX_LEN=55;
  const len=Math.min(speedKn/MAX_SPD,1)*MAX_LEN + (speedKn>0.05?6:0);

  let relDir = (vesselHeading!==null) ? (dirDeg - vesselHeading) : dirDeg;
  // relDir=0 means moving forward (bow direction = up in SVG)
  const rad = relDir * Math.PI/180;
  // In SVG: bow = up = -y, so forward = dy<0
  const dx = Math.sin(rad)*len;
  const dy = -Math.cos(rad)*len;

  const px=150, py=165; // pilot position in vessel SVG coords
  const ex=px+dx, ey=py+dy;

  const vl=document.getElementById('vLine');
  vl.setAttribute('x1',px); vl.setAttribute('y1',py);
  vl.setAttribute('x2',ex); vl.setAttribute('y2',ey);

  // Arrowhead
  const hLen=Math.max(5,len*0.22);
  const ang=Math.atan2(dy,dx);
  const a1x=ex-hLen*Math.cos(ang-0.42), a1y=ey-hLen*Math.sin(ang-0.42);
  const a2x=ex-hLen*Math.cos(ang+0.42), a2y=ey-hLen*Math.sin(ang+0.42);
  document.getElementById('vHead').setAttribute('points',`${ex},${ey} ${a1x},${a1y} ${a2x},${a2y}`);

  // Color by speed
  let col='#3effa0';
  if(speedKn>1.0) col='#ffe066';
  if(speedKn>2.0) col='#ff7744';
  if(speedKn>2.8) col='#ff3333';
  vl.setAttribute('stroke',col);
  document.getElementById('vHead').setAttribute('fill',col);

  // Bottom label
  const dirStr = dirDeg!==null ? `${String(Math.round(dirDeg)).padStart(3,'0')}° (${toCard(dirDeg)})` : '---°';
  document.getElementById('svgLabel').textContent=`SPD: ${speedKn.toFixed(1)} kn   DIR: ${dirStr}`;
  document.getElementById('svgLabel').setAttribute('fill',col);
}

function clearVector(){
  ['x2','y2'].forEach(a=>{
    document.getElementById('vLine').setAttribute(a==='x2'?'x2':'y2',a==='x2'?150:165);
  });
  document.getElementById('vLine').setAttribute('x2',150);
  document.getElementById('vLine').setAttribute('y2',165);
  document.getElementById('vHead').setAttribute('points','150,165 150,165 150,165');
}

function applyHeading(){
  const v=parseFloat(document.getElementById('hdgInput').value);
  if(!isNaN(v)&&v>=0&&v<=360){
    vesselHeading=v%360;
    rotateVessel(vesselHeading);
    document.getElementById('clrBtn').style.display='inline-block';
    // Re-render vector with current data
    if(currentDir!==null) updateVector(currentSpd, currentDir);
  }
}
function clearHeading(){
  vesselHeading=null;
  document.getElementById('hdgInput').value='';
  document.getElementById('clrBtn').style.display='none';
  rotateVessel(0);
  document.getElementById('hdgReadout').textContent='HDG: ---°';
}

function setStatus(on){
  document.getElementById('statusDot').className='status-dot'+(on?' on':'');
  document.getElementById('statusTxt').textContent=on?'GPS ACTIVE · 1 SEC UPDATE':'STANDBY';
  document.getElementById('statusTxt').style.color=on?'#3effa0':'#3a5a72';
}

function onPosition(pos){
  const{latitude:lat,longitude:lon,speed:spd,bearing:brng,accuracy:acc}=pos.coords;

  document.getElementById('latVal').textContent=toDegMin(lat,true);
  document.getElementById('lonVal').textContent=toDegMin(lon,false);

  const accBox=document.getElementById('accBox');
  document.getElementById('accVal').textContent=acc!=null?`±${Math.round(acc)} m`:'--';
  if(acc>ACC_LIMIT){
    accBox.classList.add('warn');
    const wb=document.getElementById('warnBanner');
    wb.style.display='block';
    wb.textContent=`⚠ Accuracy ${Math.round(acc)} m exceeds limit (${ACC_LIMIT} m) — data ignored`;
    return;
  }
  accBox.classList.remove('warn');
  document.getElementById('warnBanner').style.display='none';

  const kn=(spd!=null&&spd>=0)?msToKnots(spd):0;
  currentSpd=kn;
  const sEl=document.getElementById('spdVal');
  sEl.textContent=kn.toFixed(1);
  sEl.className='card-val'+(kn>0.05?' on-spd':'');

  if(brng!=null){
    const deg=Math.round(brng)%360;
    currentDir=deg;
    const dEl=document.getElementById('dirVal');
    dEl.textContent=String(deg).padStart(3,'0');
    dEl.className='card-val on-dir';
    document.getElementById('dirCard').textContent=toCard(deg);
    updateVector(kn,deg);
  } else {
    if(kn<0.05) clearVector();
    document.getElementById('svgLabel').textContent=`SPD: ${kn.toFixed(1)} kn   DIR: ---°`;
  }

  if(lastPos){
    totalDist+=haversine(lastPos.lat,lastPos.lon,lat,lon);
    document.getElementById('distVal').textContent=
      totalDist>=1000?`${(totalDist/1000).toFixed(2)} km`:`${Math.round(totalDist)} m`;
  }
  lastPos={lat,lon};
}

function onError(err){
  document.getElementById('warnBanner').style.display='block';
  document.getElementById('warnBanner').textContent='❌ '+(err.message||'Location access failed');
  setStatus(false); stopTracking();
}

function startTracking(){
  if(!navigator.geolocation){
    document.getElementById('warnBanner').style.display='block';
    document.getElementById('warnBanner').textContent='❌ Geolocation not supported';
    return;
  }
  document.getElementById('warnBanner').style.display='none';
  watchId=navigator.geolocation.watchPosition(onPosition,onError,
    {enableHighAccuracy:true,timeout:10000,maximumAge:0});
  setStatus(true);
  const b=document.getElementById('mainBtn');
  b.textContent='■ STOP GPS'; b.className='btn-main btn-stop'; b.onclick=stopTracking;
}
function stopTracking(){
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  setStatus(false);
  const b=document.getElementById('mainBtn');
  b.textContent='▶ START GPS'; b.className='btn-main btn-start'; b.onclick=startTracking;
}
function resetData(){
  totalDist=0; lastPos=null; currentSpd=0; currentDir=null;
